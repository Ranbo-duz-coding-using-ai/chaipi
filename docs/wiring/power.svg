<text x="807.5" y="540" text-anchor="middle" style="font-size:13.5px" fill="#555">VCC, GND</text>
<path d="M775 460 L775 490" fill="none" stroke="#d7263d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M840 630 L840 600" fill="none" stroke="#222222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="880" y="490" width="125" height="110" rx="12" fill="#fbf1f2" stroke="#d7263d" stroke-width="2"/>
<text x="942.5" y="517" text-anchor="middle" style="font-size:16px;font-weight:700" fill="#1b1b1b">MAX98357A</text>
<text x="942.5" y="540" text-anchor="middle" style="font-size:13.5px" fill="#555">VIN, GND</text>
<text x="942.5" y="559" text-anchor="middle" style="font-size:13.5px" fill="#555">(optional)</text>
<path d="M910 460 L910 490" fill="none" stroke="#d7263d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M975 630 L975 600" fill="none" stroke="#222222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1015" y="490" width="125" height="110" rx="12" fill="#fbf1f2" stroke="#d7263d" stroke-width="2"/>
<text x="1077.5" y="517" text-anchor="middle" style="font-size:16px;font-weight:700" fill="#1b1b1b">Capacitor</text>
