<path d="M1066 350 L1210 350 L1210 630 L705 630" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="butt"/>
<path d="M1066 350 L1210 350 L1210 630 L705 630" fill="none" stroke="#222222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1168" y="452" text-anchor="end" style="font-size:13px;font-weight:700" fill="#d7263d">5 V bus</text>
<text x="1198" y="650" text-anchor="end" style="font-size:13px;font-weight:700" fill="#222">GND bus</text>
