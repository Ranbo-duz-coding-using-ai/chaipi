<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ChAIpi Transfer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<div class="app" id="app" aria-live="polite">
  <header class="top">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 100 100"><path d="M30 56H70L64.5 84Q63.6 88 59.5 88H40.5Q36.4 88 35.5 84Z" class="s-ink"/><path d="M39 47H61" class="s-acc"/><circle cx="50" cy="31" r="9" class="s-acc"/><path d="M70 12.5Q71.04 17.96 76.5 19Q71.04 20.04 70 25.5Q68.96 20.04 63.5 19Q68.96 17.96 70 12.5Z" class="f-berry"/></svg>
    </span>
    <span class="brand">Ch<em>AI</em>pi</span>
    <span class="pill" id="pill" hidden><i></i><span id="pillText">connected</span></span>
  </header>
  <main id="main"><div class="spin" aria-label="Loading"></div></main>
  <nav class="nav" id="nav" hidden aria-label="Sections"></nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
</div>
<noscript><p style="padding:24px">This page needs JavaScript to talk to ChAIpi.</p></noscript>
<script src="/portal.js"></script>
</body>
</html>
